<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram-story – Gemeente Katwijk</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#002f70">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Story maker">
<style>
  :root{ --donkerblauw:#002f70; --line:#d5dce6; --muted:#5a6b82; --font:'Maax', Arial, 'Liberation Sans', Helvetica, sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:#eef1f5;color:var(--donkerblauw);min-height:100vh;padding:24px 20px 40px}
  .wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:auto 380px;gap:32px;align-items:start;justify-content:center}
  @media (max-width:860px){ .wrap{grid-template-columns:1fr;justify-items:center} .panel{width:100%} canvas#cv{height:min(60vh,700px)!important;width:auto} body{padding:14px 12px 32px} }
  canvas#cv{height:min(84vh,860px);aspect-ratio:9/16;max-width:100%;display:block;border-radius:14px;box-shadow:0 6px 28px rgba(0,47,112,.18);touch-action:none;background:#002f70}
  canvas#cv.dragging{cursor:grabbing!important}
  .panel{display:flex;flex-direction:column;gap:22px}
  .step{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,47,112,.08)}
  .step h2{font:700 17px var(--font);margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .step h2 b{width:28px;height:28px;border-radius:50%;background:var(--donkerblauw);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .layouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .themes{display:flex;gap:10px;margin-top:14px;align-items:center;font:500 14px var(--font)}
  .themes button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;overflow:hidden;display:flex}
  .themes button i{flex:1}
  .themes button[aria-pressed=true]{box-shadow:0 0 0 3px #e9804f}
  .layouts button{padding:3px;border:2px solid transparent;border-radius:10px;background:none;cursor:pointer}
  .layouts button[aria-pressed=true]{border-color:#e9804f}
  .layouts canvas{width:100%;aspect-ratio:9/16;border-radius:6px;display:block}
  .big{font:600 16px var(--font);width:100%;padding:13px 16px;border-radius:10px;border:2px solid var(--donkerblauw);background:#fff;color:var(--donkerblauw);cursor:pointer;text-align:center;display:block}
  .big.primary{background:var(--donkerblauw);color:#fff}
  .big input{display:none}
  .stage{display:flex;flex-direction:column;gap:10px;width:max-content;max-width:100%}
  .cvwrap{position:relative}
  .stage .tip{margin:0;max-width:100%;width:0;min-width:100%;text-align:center}
  .zoom{display:flex;align-items:center;gap:12px;font:500 14px var(--font);background:#fff;border-radius:12px;padding:10px 16px;box-shadow:0 1px 3px rgba(0,47,112,.08);width:0;min-width:100%}
  .inline{position:absolute;margin:0;border:0;outline:2px dashed rgba(255,255,255,.85);outline-offset:4px;border-radius:4px;background:rgba(0,0,0,.18);
    resize:none;overflow:hidden;white-space:pre-wrap;padding:0;caret-color:#fff}
  .zoom input{flex:1;accent-color:var(--donkerblauw)}
  .zoom input:disabled{opacity:.4}
  .tip{font-size:13px;color:var(--muted);margin-top:8px}
  label.field{display:block;font:600 14px var(--font);margin:0 0 6px}
  label.field span{font-weight:400;color:var(--muted)}
  textarea,input[type=text]{font:400 16px var(--font);color:var(--donkerblauw);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;resize:none;margin-bottom:14px}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{font:500 14px var(--font);padding:10px;border:0;background:#fff;color:var(--donkerblauw);cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed=true]{background:var(--donkerblauw);color:#fff}
  .seg.off{opacity:.45;pointer-events:none}
  .install{max-width:1000px;margin:0 auto 18px;display:none;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,47,112,.08)}
  .install.show{display:flex}
  .install img{width:44px;height:44px;border-radius:10px;flex:none}
  .install p{flex:1;font:500 14px var(--font);line-height:1.35}
  .install p span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
  .install button{font:600 15px var(--font);padding:10px 16px;border-radius:10px;border:0;background:var(--donkerblauw);color:#fff;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div class="install" id="install"><img src="icon-192.png" alt="">
  <p>Installeer als app<span>Opent zonder browser en werkt ook offline.</span></p>
  <button type="button" id="installBtn">Installeren</button></div>
<div class="wrap">
  <div class="stage">
    <div class="cvwrap">
      <canvas id="cv" width="1080" height="1920" class="empty" tabindex="0" aria-label="Voorbeeld van de story"></canvas>
      <textarea id="inline" class="inline" rows="1" spellcheck="false" aria-label="Tekst aanpassen" hidden></textarea>
    </div>
    <div class="zoom"><span>Inzoomen</span><input type="range" id="zoom" min="1" max="3" step="0.01" value="1" disabled></div>
    <p class="tip" id="tip">Tik op een foto-vlak om een foto te kiezen. Tik op de tekst om hem aan te passen.</p>
  </div>

  <div class="panel">
    <section class="step"><h2><b>1</b>Kies een vorm en kleur</h2><div class="layouts" id="layouts"></div>
      <div class="themes" id="themes">Kleur</div></section>

    <section class="step"><h2><b>2</b>Kies een foto</h2>
      <label class="big">Foto kiezen<input type="file" id="file" accept="image/*"></label>
    </section>

    <section class="step"><h2><b>3</b>Typ de tekst</h2>
      <label class="field" for="title">Titel</label>
      <textarea id="title" rows="2" placeholder="Typ hier de titel">Hier komt de titel</textarea>
      <label class="field" for="sub">Ondertitel <span>(mag leeg blijven)</span></label>
      <input type="text" id="sub" value="Korte ondertitel" placeholder="Typ hier een ondertitel">
      <div class="seg" id="subPos" role="group" aria-label="Plaats van de ondertitel">
        <button type="button" data-pos="above" aria-pressed="true">Boven de titel</button>
        <button type="button" data-pos="below" aria-pressed="false">Onder de titel</button>
      </div>
    </section>

    <section class="step"><h2><b>4</b>Download</h2>
      <button type="button" class="big primary" id="download">Download story</button>
      <p class="tip">Je krijgt een afbeelding van 1440 × 2560 pixels, klaar voor Instagram.</p>
    </section>
  </div>
</div>

//   {t:'shape', p, cx, cy, R, rot, flip, fill:'bg'|'accent'|'hi'|'white', alpha}  merkvorm (p = m1/m2/m3), R = straal in px
//   {t:'photo', ...zelfde maten}  of {t:'photo', full:1}                         de foto, in een vorm of beeldvullend
//   {t:'mark', x, y, h, alpha}                                                 wit beeldmerk (K met golven)
//   {t:'shade', y0, y1}                                                        verloop van transparant naar achtergrondkleur
// text: x, anchor 'bottom'|'top', y; het logo staat onder (bottom) of boven (top) het tekstblok.
const LAYOUTS = [{"name": "Golf", "layers": [{"t": "photo", "p": "m2", "cx": 330, "cy": 170, "R": 610, "rot": -8, "flip": 0}, {"t": "shape", "p": "m2", "cx": 740, "cy": 960, "R": 420, "rot": 30, "flip": 0, "fill": "accent", "alpha": 0.88}], "text": {"x": 64, "anchor": "bottom", "y": 1090, "maxW": 592, "title": 88, "sub": 42}}, {"name": "Boog", "layers": [{"t": "mark", "x": 330, "y": 60, "h": 560, "alpha": 0.07}, {"t": "shape", "p": "m2", "cx": 120, "cy": 980, "R": 520, "rot": 160, "flip": 1, "fill": "accent"}, {"t": "photo", "p": "m2", "cx": 430, "cy": 1150, "R": 620, "rot": 172, "flip": 0}], "text": {"x": 64, "anchor": "top", "y": 190, "maxW": 592, "title": 88, "sub": 42}}, {"name": "Kaart", "layers": [{"t": "shape", "p": "m3", "cx": 420, "cy": 470, "R": 430, "rot": 4, "flip": 0, "fill": "accent"}, {"t": "photo", "p": "m3", "cx": 340, "cy": 400, "R": 410, "rot": -9, "flip": 0}], "text": {"x": 64, "anchor": "bottom", "y": 1090, "maxW": 592, "title": 88, "sub": 42}}, {"name": "Groot", "layers": [{"t": "photo", "full": 1}, {"t": "shade", "y0": 560, "y1": 900}, {"t": "shape", "p": "m1", "cx": 700, "cy": 830, "R": 300, "rot": 60, "flip": 0, "fill": "accent", "alpha": 0.9}, {"t": "shape", "p": "m2", "cx": 300, "cy": 1290, "R": 640, "rot": 15, "flip": 0, "fill": "bg"}], "text": {"x": 64, "anchor": "bottom", "y": 1090, "maxW": 592, "title": 88, "sub": 42}}, {"name": "Duo", "layers": [{"t": "shape", "p": "m2", "cx": 460, "cy": 370, "R": 475, "rot": 40, "flip": 0, "fill": "accent"}, {"t": "photo", "p": "m2", "cx": 360, "cy": 400, "R": 360, "rot": -12, "flip": 0}], "text": {"x": 64, "anchor": "bottom", "y": 1090, "maxW": 592, "title": 88, "sub": 42}}];

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let textBox = null, textHits = {}, editing = null;
const state = { layout:0, subPos:'above' };
const fontFam = () => getComputedStyle(document.body).fontFamily;

// ---------- Vormen ----------
function applyShape(c, s){
  const g = SHAPES[s.p], k = s.R / g.r;
  c.translate(s.cx, s.cy); c.rotate(s.rot * Math.PI / 180); c.scale(s.flip ? -k : k, k); c.translate(-g.ox, -g.oy);
  return new Path2D(g.d);
}
// Zichtbaar kader van de fotovorm binnen het beeld (de foto moet dit altijd vullen)
const probe = document.createElementNS('http://www.w3.org/2000/svg','path');
function photoBox(L){
  const s = L.layers.find(x => x.t === 'photo');
  if(s.full) return { x0:0, y0:0, x1:W, y1:H };
  const g = SHAPES[s.p], k = s.R / g.r, a = s.rot * Math.PI / 180, f = s.flip ? -1 : 1;
  probe.setAttribute('d', g.d); const len = probe.getTotalLength();
  let x0=W, y0=H, x1=0, y1=0;
  for(let i=0;i<=600;i++){
    const p = probe.getPointAtLength(len*i/600), x = (p.x-g.ox)*k*f, y = (p.y-g.oy)*k;
    const X = Math.min(W, Math.max(0, s.cx + x*Math.cos(a) - y*Math.sin(a))), Y = Math.min(H, Math.max(0, s.cy + x*Math.sin(a) + y*Math.cos(a)));
    x0=Math.min(x0,X); y0=Math.min(y0,Y); x1=Math.max(x1,X); y1=Math.max(y1,Y);
  }
  return { x0, y0, x1, y1 };
}

// ---------- Foto ----------
const v = { img:null, iw:0, ih:0, zoom:1, x:0, y:0, base:1, box:null };
function size(){ const k = v.base*v.zoom; return { w:v.iw*k, h:v.ih*k }; }
function fitPhoto(keepCentre){
  if(!v.img) return;
  const b = v.box = photoBox(LAYOUTS[state.layout]);
  const prev = keepCentre && v.base ? size() : null;
  v.base = Math.max((b.x1-b.x0)/v.iw, (b.y1-b.y0)/v.ih);
  const {w,h} = size(); v.x = (b.x0+b.x1-w)/2; v.y = (b.y0+b.y1-h)/2; clamp();
}
function clamp(){
  const b = v.box, {w,h} = size();
  v.x = Math.min(b.x0, Math.max(b.x1-w, v.x)); v.y = Math.min(b.y0, Math.max(b.y1-h, v.y));
}
function setZoom(z){
  const b = v.box, ax = (b.x0+b.x1)/2, ay = (b.y0+b.y1)/2, r = z / v.zoom;
  v.x = ax - (ax - v.x) * r; v.y = ay - (ay - v.y) * r; v.zoom = z; clamp(); draw();
}

// ---------- Tekst ----------
function wrap(c, text, font, maxW){
  c.font = font; const out = [];
  for(const para of text.split('\n')){
    let line = '';
    for(const w of para.split(/\s+/).filter(Boolean)){
      const t = line ? line+' '+w : w;
      if(c.measureText(t).width <= maxW || !line) line = t; else { out.push(line); line = w; }
    }
    if(line) out.push(line);
  }
  return out;
}
function textBlock(c, T){
  // titel: max. 3 regels; te lang → kleiner
  let ts = T.title, tl;
  for(;;){ tl = wrap(c, $('title').value, `700 ${ts}px ${fontFam()}`, T.maxW);
    const tooWide = tl.some(l => { c.font = `700 ${ts}px ${fontFam()}`; return c.measureText(l).width > T.maxW; });
    if((tl.length <= 3 && !tooWide) || ts < T.title*.5) break; ts *= .94; }
  let ss = T.sub, sl = $('sub').value.trim() ? wrap(c, $('sub').value.trim(), `500 ${ss}px ${fontFam()}`, T.maxW) : [];
  while(sl.length > 2 && ss > T.sub*.6){ ss *= .94; sl = wrap(c, $('sub').value.trim(), `500 ${ss}px ${fontFam()}`, T.maxW); }
  const tLead = ts*1.0, sLead = ss*1.18, gap = ss*.5;
  const titleItems = tl.map(l => ({ field:'title', size:ts, weight:700, text:l, font:`700 ${ts}px ${fontFam()}`, color:C.title, lead:tLead, asc:ts*.72, desc:ts*.22 }));
  const subItems = sl.map(l => ({ field:'sub', size:ss, weight:500, text:l, font:`500 ${ss}px ${fontFam()}`, color:C.hi, lead:sLead, asc:ss*.72, desc:ss*.22 }));
  const order = (state.subPos === 'above' ? [subItems, titleItems] : [titleItems, subItems]).filter(b => b.length);
  // basislijnen: binnen een blok de regelafstand; tussen blokken onderkant letters + vaste ruimte + hoofdletterhoogte
  const items = []; let y = 0, prev = null;
  order.forEach(bl => bl.forEach((it, i) => {
    if(!prev) y = it.asc; else if(i === 0) y += prev.desc + gap + it.asc; else y += it.lead;
    items.push({ ...it, y }); prev = it;
  }));
  const height = y, LOGO_H = 40, LOGO_GAP = 46, lg = IMG.logo, lw = lg.naturalWidth ? LOGO_H*lg.naturalWidth/lg.naturalHeight : 0;
  // logo onder het tekstblok (anker onder) of erboven (anker boven)
  const top = T.anchor === 'bottom' ? T.y - LOGO_H - LOGO_GAP - height : T.y + LOGO_H + LOGO_GAP;
  const logoY = T.anchor === 'bottom' ? T.y - LOGO_H : T.y;
  if(lw) c.drawImage(lg, T.x, logoY, lw, LOGO_H);
  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  const hits = {};
  items.forEach(it => {
    const f = it.field, w = (c.font = it.font, c.measureText(it.text).width), y0 = top + it.y - it.asc - 6, y1 = top + it.y + it.desc + 6;
    const h = hits[f] ||= { x0:T.x, x1:T.x, y0, y1, size:it.size, lead:it.lead, weight:it.weight, color:it.color, maxW:T.maxW, first:top + it.y - it.asc };
    h.x1 = Math.max(h.x1, T.x + w); h.y0 = Math.min(h.y0, y0); h.y1 = Math.max(h.y1, y1);
    if(c === ctx && editing === f) return;                    // tekst die je aan het typen bent niet dubbel tekenen
    c.fillStyle = it.color; c.fillText(it.text, T.x, top + it.y);
  });
  if(c === ctx) textHits = hits;
  const tb = { x0:T.x - 10, y0:Math.min(top, logoY) - 10, x1:T.x + T.maxW + 10, y1:Math.max(top + height, logoY + LOGO_H) + 20 };
  if(c === ctx) textBox = tb;
}

// ---------- Tekenen ----------
function render(c, k, li = state.layout, withText = true, withPhoto = true){
  const L = LAYOUTS[li];
  c.save(); c.setTransform(k,0,0,k,0,0);
  c.fillStyle = C.bg; c.fillRect(0,0,W,H);
  for(const s of L.layers){
    c.save();
    if(s.t === 'photo'){
      if(!s.full) c.clip(applyShape(c, s));
      c.setTransform(k,0,0,k,0,0);
      if(withPhoto && v.img){ const {w,h} = size(); c.imageSmoothingQuality='high'; c.drawImage(v.img, v.x, v.y, w, h); }
      else { c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(0,0,W,H); if(withText){ c.fillStyle=C.bg; c.font=`600 30px ${fontFam()}`; c.textAlign='center';
        const b = photoBox(L); c.fillText('Kies een foto', (b.x0+b.x1)/2, (b.y0+b.y1)/2); } }
    } else if(s.t === 'shape'){
      c.globalAlpha = s.alpha ?? 1; c.fillStyle = s.fill === 'white' ? '#fff' : C[s.fill]; c.fill(applyShape(c, s));
    } else if(s.t === 'mark'){
      const m = IMG.mark; if(m.naturalWidth){ c.globalAlpha = s.alpha; c.drawImage(m, s.x, s.y, s.h*m.naturalWidth/m.naturalHeight, s.h); }
    } else if(s.t === 'shade'){
      const g = c.createLinearGradient(0, s.y0, 0, s.y1); g.addColorStop(0, C.bg + '00'); g.addColorStop(1, C.bg); c.fillStyle = g; c.fillRect(0, s.y0, W, H - s.y0);
    }
    c.restore();
  }
  if(withText) textBlock(c, L.text);
  c.restore();
}
function draw(){
  render(ctx, cv.width / W);
  const m = movable();
  $('zoom').disabled = !v.img; $('zoom').value = v.zoom;
  $('tip').textContent = !v.img ? 'Tik op het foto-vlak om een foto te kiezen. Tik op de tekst om hem aan te passen.'
    : m ? 'Sleep de foto om hem te verschuiven. Tik op de tekst om hem aan te passen.' : 'Zoom in om de foto te verschuiven. Tik op de tekst om hem aan te passen.';
  document.querySelectorAll('#layouts button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === state.layout));
  document.querySelectorAll('#themes button').forEach(b => b.setAttribute('aria-pressed', THEMES[+b.dataset.t] === C));
  cv.style.background = C.bg;
  document.querySelectorAll('#subPos button').forEach(b => b.setAttribute('aria-pressed', b.dataset.pos === state.subPos));
  $('subPos').classList.toggle('off', !$('sub').value.trim());
}

// ---------- Bediening ----------
LAYOUTS.forEach((L,i) => {
  const b = document.createElement('button'); b.type='button'; b.dataset.i = i; b.title = L.name; b.setAttribute('aria-label', L.name);
  const m = document.createElement('canvas'); m.width = 180; m.height = 320; b.append(m);
  b.onclick = () => { state.layout = i; v.zoom = 1; fitPhoto(); draw(); };
  $('layouts').append(b);
});
THEMES.forEach((t,i) => {
  const b = document.createElement('button'); b.type='button'; b.dataset.t = i; b.title = t.name; b.setAttribute('aria-label', 'Kleur ' + t.name);
  b.innerHTML = `<i style="background:${t.bg}"></i><i style="background:${t.accent}"></i><i style="background:${t.hi}"></i>`;
  b.onclick = () => { C = THEMES[i]; thumbs(); draw(); }; $('themes').append(b);
});
function thumbs(){ document.querySelectorAll('#layouts canvas').forEach((m,i) => render(m.getContext('2d'), m.width / W, i, false, false)); }

function load(file){
  if(!file || !file.type.startsWith('image/')) return;
  const im = new Image();
  im.onload = () => { v.img = im; v.iw = im.naturalWidth; v.ih = im.naturalHeight; v.zoom = 1; fitPhoto(); draw(); };
  im.src = URL.createObjectURL(file);
}
$('file').onchange = e => load(e.target.files[0]);
cv.addEventListener('dragover', e => e.preventDefault());
cv.addEventListener('drop', e => { e.preventDefault(); load(e.dataTransfer.files[0]); });
$('zoom').oninput = e => setZoom(+e.target.value);
['title','sub'].forEach(id => $(id).addEventListener('input', () => { draw(); if(editing === id){ inline.value = $(id).value; placeInline(); } }));
document.querySelectorAll('#subPos button').forEach(b => b.onclick = () => { state.subPos = b.dataset.pos; draw(); });

// Alleen slepen als je echt op de zichtbare foto drukt: binnen de fotovorm en niet op een vorm, verloop of tekst erboven
const hitCtx = document.createElement('canvas').getContext('2d');
function toDesign(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height }; }
function onPhoto(x, y){
  const L = LAYOUTS[state.layout], i = L.layers.findIndex(l => l.t === 'photo'), ph = L.layers[i];
  const inShape = s => { hitCtx.setTransform(1,0,0,1,0,0); const p = applyShape(hitCtx, s); return hitCtx.isPointInPath(p, x, y); };
  if(!(ph.full ? true : inShape(ph))) return false;
  for(const l of L.layers.slice(i+1)){                       // lagen die over de foto liggen
    if(l.t === 'shape' && (l.alpha ?? 1) >= .5 && inShape(l)) return false;
    if(l.t === 'shade' && y > (l.y0 + l.y1) / 2) return false;
  }
  return !(textBox && x >= textBox.x0 && x <= textBox.x1 && y >= textBox.y0 && y <= textBox.y1);
}
function movable(){ return v.img && (size().w > (v.box.x1-v.box.x0)+.5 || size().h > (v.box.y1-v.box.y0)+.5); }
let drag = null;
// ---------- Tekst direct in de preview aanpassen ----------
const inline = $('inline');
function textAt(x, y){ for(const f of ['title','sub']){ const h = textHits[f]; if(h && x >= h.x0-8 && x <= h.x1+12 && y >= h.y0 && y <= h.y1) return f; } return null; }
function placeInline(){
  const h = textHits[editing]; if(!h){ inline.hidden = true; return; }
  const k = cv.getBoundingClientRect().width / W;
  Object.assign(inline.style, { left:h.x0*k+'px', top:(h.first - h.size*.2)*k+'px', width:(h.maxW+8)*k+'px', height:'auto',
    font:`${h.weight} ${h.size*k}px/${h.lead*k}px ${fontFam()}`, color:h.color, letterSpacing:'normal' });
  inline.style.height = inline.scrollHeight + 'px';
}
function startEdit(f){
  editing = f; inline.value = $(f).value; inline.hidden = false; draw(); placeInline();
  inline.focus(); inline.setSelectionRange(inline.value.length, inline.value.length);
}
function stopEdit(){ if(!editing) return; editing = null; inline.hidden = true; draw(); }
inline.addEventListener('input', () => { $(editing).value = editing === 'sub' ? inline.value.replace(/\n/g,' ') : inline.value; draw(); placeInline(); });
inline.addEventListener('keydown', e => { if(e.key === 'Escape' || (e.key === 'Enter' && editing === 'sub')){ e.preventDefault(); inline.blur(); } });
inline.addEventListener('blur', stopEdit);
addEventListener('resize', () => editing && placeInline());

cv.addEventListener('pointerdown', e => {
  const {x, y} = toDesign(e);
  const f = textAt(x, y);
  if(f){ e.preventDefault(); startEdit(f); return; }          // tik op tekst = tekst aanpassen
  if(!onPhoto(x, y)) return;                                  // naast de foto: niets doen
  if(!v.img){ $('file').click(); return; }
  if(!movable()) return;
  drag = { x:e.clientX, y:e.clientY, vx:v.x, vy:v.y }; cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if(!drag){                                                  // cursor alleen als handje boven de foto
    const {x, y} = toDesign(e), hit = onPhoto(x, y);
    cv.style.cursor = textAt(x, y) ? 'text' : !hit ? 'default' : !v.img ? 'pointer' : movable() ? 'grab' : 'default';
    return;
  }
  const k = W / cv.getBoundingClientRect().width;
  v.x = drag.vx + (e.clientX-drag.x)*k; v.y = drag.vy + (e.clientY-drag.y)*k; clamp(); draw();
});
['pointerup','pointercancel'].forEach(t => cv.addEventListener(t, () => { drag = null; cv.classList.remove('dragging'); }));

$('download').onclick = () => {
  const c = document.createElement('canvas'); c.width = W*OUT; c.height = H*OUT; render(c.getContext('2d'), OUT);
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    const name = ($('title').value.trim().split(/\s+/).slice(0,4).join('-') || 'story').toLowerCase().replace(/[^a-z0-9-]/g,'');
    a.download = `instagram-story-${name}.jpg`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, 'image/jpeg', 0.95);
};

// ---------- Installeren als app ----------
if('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; $('install').classList.add('show'); });
$('installBtn').onclick = async () => {
  if(!installPrompt) return;
  installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; $('install').classList.remove('show');
};
addEventListener('appinstalled', () => $('install').classList.remove('show'));

(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { thumbs(); draw(); });
thumbs(); draw();
</script>
</body>
</html>
