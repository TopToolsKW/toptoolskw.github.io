<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huisstijltools – Gemeente Katwijk</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#002f70">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Huisstijltools">
<style>
  :root{ --donkerblauw:#002f70; --line:#d5dce6; --muted:#5a6b82; --bg:#eef1f5;
         --font:'Maax', Arial, 'Liberation Sans', Helvetica, sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--donkerblauw)}

  /* ---------- Overzicht ---------- */
  header.top{background:var(--donkerblauw);color:#fff}
  header.top .in{max-width:1200px;margin:0 auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  header.top img{height:34px;width:auto;align-self:flex-start}
  header.top h1{font:700 34px/1.1 var(--font);letter-spacing:-.01em}
  header.top p{font:400 16px/1.45 var(--font);color:rgba(255,255,255,.82);max-width:640px}

  main{max-width:1200px;margin:0 auto;padding:32px 24px 56px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px}

  a.card{display:flex;flex-direction:column;background:#fff;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;
         box-shadow:0 1px 3px rgba(0,47,112,.08);transition:transform .15s ease, box-shadow .15s ease;outline:none}
  a.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,47,112,.16)}
  a.card:focus-visible{box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--donkerblauw)}
  .prev{aspect-ratio:16/9;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
  .prev img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
  a.card:hover .prev img{transform:scale(1.03)}
  .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
  .meta{font:500 12px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .body h2{font:700 21px/1.2 var(--font)}
  .body p{font:400 14.5px/1.5 var(--font);color:#33476a;flex:1}
  .open{margin-top:8px;align-self:flex-start;font:500 14px var(--font);background:var(--donkerblauw);color:#fff;padding:9px 14px;border-radius:8px}

  footer{max-width:1200px;margin:0 auto;padding:0 24px 32px;font-size:13px;color:var(--muted)}

  /* ---------- Toolweergave ---------- */
  #view{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
  body.in-tool #view{display:flex}
  body.in-tool #home{display:none}
  .bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex:none}
  .bar a,.bar button{font:500 14px var(--font);border:1px solid var(--line);background:#fff;color:var(--donkerblauw);padding:8px 13px;border-radius:8px;cursor:pointer;text-decoration:none}
  .bar a:hover,.bar button:hover{border-color:var(--donkerblauw)}
  .bar h2{font:700 17px var(--font);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frames{position:relative;flex:1}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
  .frames iframe.on{display:block}
  @media (max-width:600px){ .bar .newwin{display:none} header.top h1{font-size:28px} }
</style>
</head>

const $ = id => document.getElementById(id);
const decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
const cache = {};
const source = t => (cache[t.id] ||= decode(t.html));

// Kaartjes
for(const t of TOOLS){
  const a = document.createElement('a'); a.className = 'card'; a.href = '#' + t.id;
  a.innerHTML = `<div class="prev"><img src="${t.img}" alt=""></div>
    <div class="body"><h2>${t.title}</h2><p>${t.text}</p><span class="open">Openen →</span></div>`;
  $('grid').append(a);
}

// Navigatie via #hash, zodat de terugknop van de browser ook werkt.
// Elke tool krijgt een eigen frame dat blijft bestaan: terug naar het overzicht en weer open = werk is er nog.
const frames = {};
function route(){
  const t = TOOLS.find(x => '#' + x.id === location.hash);
  document.body.classList.toggle('in-tool', !!t);
  Object.values(frames).forEach(f => f.classList.remove('on'));
  if(!t){ document.title = 'Huisstijltools – Gemeente Katwijk'; return; }
  if(!frames[t.id]){
    const f = document.createElement('iframe'); f.title = t.title; f.srcdoc = source(t);
    $('frames').append(f); frames[t.id] = f;
  }
  frames[t.id].classList.add('on');
  $('toolTitle').textContent = t.title;
  document.title = t.title + ' – Gemeente Katwijk';
}
addEventListener('hashchange', route); route();

$('newwin').onclick = () => {
  const t = TOOLS.find(x => '#' + x.id === location.hash); if(!t) return;
  const url = URL.createObjectURL(new Blob([source(t)], {type:'text/html'}));
  window.open(url, '_blank');
};
</script>
<script>
// ---------- Installeren als app ----------
// Werkt offline via sw.js; de knop verschijnt alleen als Chrome aangeeft dat installeren kan.
if('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('/sw.js').catch(() => {});
(() => {
  const css = document.createElement('style');
  css.textContent = `.install-app{display:none;align-self:flex-start;align-items:center;gap:8px;font:600 14px var(--font);background:#fff;color:var(--donkerblauw);
    border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.install-app.show{display:inline-flex}
    .install-app img{width:20px;height:20px;border-radius:5px}`;
  document.head.append(css);
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'install-app';
  btn.innerHTML = '<img src="/icon-192.png" alt="">Installeer als app';
  (document.querySelector('header.top .in') || document.body).append(btn);
  let prompt = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt = e; btn.classList.add('show'); });
  btn.onclick = async () => { if(!prompt) return; prompt.prompt(); await prompt.userChoice; prompt = null; btn.classList.remove('show'); };
  addEventListener('appinstalled', () => btn.classList.remove('show'));
})();
</script>
</body>
</html>
